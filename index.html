const bd=s=>`<span class="badge ${s===IN?"":s===EX?"e":"w"}">${s}</span>`;
function login(){S={step:"login",m:"",p:{}};
 shell("Inscrição 27.1",`<h2>Entrar</h2><div class="sec">Digite sua matrícula.</div><input id="mt" inputmode="numeric" autocomplete="off" placeholder="Matrícula"><div id="who"></div>`,`<button class="btn" id="go" disabled>Inscrição</button>`);
 $("mt").oninput=async()=>{const v=$("mt").value.trim(),r=R[v],co=CO[v];S.m=r||co?v:"";S.co=!!co;$("go").disabled=true;$("go").textContent=co?"Validar inscrições":"Inscrição";
  $("who").innerHTML=r||co?`<div class="card sel"><div class="sec">${co?"Coordenação":"Estudante"}</div><div style="font-size:16px;font-weight:700">${co||r.n}</div><div class="mono">Matrícula ${v}</div></div>`:v.length>=12?'<div class="err">Matrícula não encontrada.</div>':"";
  if(co)$("go").disabled=false;else if(r)try{await load();if($("mt").value.trim()!==v)return;S.doc=ALL[v];$("go").textContent=S.doc?"Status de inscrição":"Inscrição";$("go").disabled=false}catch(e){$("who").innerHTML+='<div class="err">Banco de dados indisponível. Abra o link entrando na conta Claude.</div>'}};
 $("go").onclick=()=>S.co?validar():S.doc?(S.step="st",render()):wiz(C.map(c=>c.k))}
function wiz(n){S.need=n;S.i=0;S.p={};S.step="w";render();scrollTo(0,0)}
function render(){
 if(S.step==="login")return login();
 const y=R[S.m].y;
 if(S.step==="w"){const k=S.need[S.i],c=C.find(x=>x.k===k),of=offs(c,y).filter(([x])=>used(k,x)<c.q),p=S.p[k]=S.p[k]||[],mn=Math.min(3,of.length),ok=p.filter(Boolean).length>=mn,last=S.i===S.need.length-1;
  shell(c.t,`<div class="row"><span class="sec">Componente ${S.i+1} de ${S.need.length}</span><span class="mono">${p.filter(Boolean).length}/${mn} escolhas</span></div><div class="bar"><i style="width:${(S.i+1)/S.need.length*100}%"></i></div><div class="sec">${of.length?"Marque a 1ª, 2ª e 3ª opção.":"Não há ofertas com vagas nesta componente."}</div>`+of.map(([x,d])=>`<div class="card ${p.includes(x)?"sel":""}"><div class="row"><b style="font-size:16px">${x}</b><span class="mono">${c.q-used(k,x)} vagas</span></div><div class="sec" style="font-weight:600">${d}</div><div class="seg">${[0,1,2].map(i=>`<button class="${p[i]===x?"on":""}" data-x="${x}" data-r="${i}">${i+1}ª</button>`).join("")}</div></div>`).join(""),
  `<button class="btn ${last?"o":""}" id="nx" ${ok?"":"disabled"}>${last?"Confirmar inscrição":"Próxima componente"}</button><button class="btn g" id="bk">${S.i?"Voltar":"Cancelar"}</button>`,`<span class="pill w">${R[S.m].n.split(" ")[0]}</span>`);
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const x=b.dataset.x,r=+b.dataset.r;if(p[r]===x)p[r]=undefined;else{const j=p.indexOf(x);if(j>=0)p[j]=undefined;p[r]=x}render()});
  $("bk").onclick=()=>{if(S.i){S.i--;render()}else{S.step="st";S.doc?render():login()}};
  $("nx").onclick=()=>last?send():(S.i++,render(),scrollTo(0,0));return}
 const d=S.doc,exc=C.map(c=>c.k).filter(k=>!d.c[k]||d.c[k].st===EX),all=exc.length===0&&C.every(c=>d.c[c.k].st===IN),av=C.some(c=>d.c[c.k]&&d.c[c.k].st===AV);

async function send(){const m=S.m,d=ALL[m]||{m,n:R[m].n,c:{}};S.need.forEach(k=>d.c[k]={ch:S.p[k].filter(Boolean),st:AV,of:null});d.r=CFG;
 try{await(await db()).doc("insc/"+m).set(d);ALL[m]=d;S.doc=d;S.msg="Inscrição enviada e registrada.";S.step="st";render();scrollTo(0,0)}catch(e){alert("Não foi possível gravar a inscrição.")}}
async function validar(){shell("Validação",'<div class="sec">Aplicando as regras de inscrição…</div>');
 try{await load();const d=await db(),a=await d.doc("adm/dados").get();if(!a.exists)throw"adm";
  const P={},T={1:0,2:0,3:0};a.data().t.split("\n").forEach(l=>{const[m,p,f]=l.split("|");P[m]={p:p==="SIM",f:parseFloat(f.replace(",","."))||0};T[R[m]&&R[m].y]++});
  const ds=Object.values(ALL),ch=new Set();
  for(const c of C){const k=c.k,oc={},oy={},Q={};[1,2,3].forEach(y=>Q[y]=Math.ceil(T[y]/offs(c,y).length));
   ds.forEach(x=>{const e=x.c[k];if(e&&e.st===IN){oc[e.of]=(oc[e.of]||0)+1;const w=e.of+R[x.m].y;oy[w]=(oy[w]||0)+1}});
   ds.filter(x=>x.c[k]&&x.c[k].st===AV).sort((a,b)=>(P[b.m]?.p?1:0)-(P[a.m]?.p?1:0)||(P[b.m]?.f||0)-(P[a.m]?.f||0)).forEach(x=>{const e=x.c[k],y=R[x.m].y,al=offs(c,y).map(z=>z[0]);e.st=EX;e.of=null;
    for(const o of e.ch){if(!al.includes(o)||(oc[o]||0)>=c.q||(CFG===1&&(oy[o+y]||0)>=Q[y]))continue;e.st=IN;e.of=o;oc[o]=(oc[o]||0)+1;oy[o+y]=(oy[o+y]||0)+1;break}ch.add(x.m)})}

 shell("Resumo da validação",(msg?`<div class="sec">${msg}</div>`:"")+C.map(c=>`<div class="card"><div class="sec">${c.t}</div>`+c.o.map((_,i)=>{const x=code(c,i);return`<div class="rk"><b>${x}</b><span class="mono">${n(c.k,IN,x)}/${c.q} inscritos</span></div>`}).join("")+`<div class="row" style="margin-top:8px"><span class="mono">Avaliação ${n(c.k,AV)}</span><span class="mono">Excedidos ${n(c.k,EX)}</span></div></div>`).join(""),
 `<button class="btn" id="csv">Exibir arquivo de inscrições</button><button class="btn o" id="nr">Iniciar nova rodada</button><button class="btn g" id="out">Sair</button>`,`<span class="pill w">Coordenação</span>`);
 $("out").onclick=login;$("csv").onclick=async()=>{const L=["matricula;nome;componente;opcoes;status;oferta"];ds.forEach(d=>C.forEach(c=>{const e=d.c[c.k];if(e)L.push([d.m,d.n,c.k,e.ch.join(" > "),e.st,e.of||""].join(";"))}));try{await(await claude.use("downloads")).save({filename:"inscricoes.csv",data:"\ufeff"+L.join("\n")})}catch(e){}};
 $("nr").onclick=async()=>{if(!confirm("Iniciar a rodada "+(CFG+1)+"?"))return;await(await db()).doc("cfg/rodada").set({r:CFG+1});CFG++;resumo("Rodada "+CFG+" iniciada. Estudantes excedidos já podem se inscrever novamente.")}}

 const t=L.map(l=>l.replace(/[^\x20-\xFF]/g,"?").replace(/[\\()]/g,"\\$&")),ct="BT /F1 12 Tf 50 790 Td 18 TL "+t.map(l=>`(${l}) Tj T*`).join("\n")+" ET",ps=[];let s="%PDF-1.4\n";
